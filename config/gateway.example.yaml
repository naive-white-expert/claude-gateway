# claude-gateway 配置示例。字段说明见 docs/方案-v0.1.md §5.3、§8.3、§8.4，渠道实测行为见 docs/M0-渠道行为.md。
# 原则：密钥一律通过环境变量（0600 环境文件 / systemd credentials）引用，本文件不出现明文。
#       真实配置另存为 config/gateway.yaml 或 config/*.local.yaml（已被 .gitignore 忽略），服务器上为 /etc/claude-gateway/gateway.yaml。
# 校验：cgw check-config --config <路径>。未知字段、缺少能力字段都会拒绝启动。

# 公网入口方式见方案 §8.5。
server:
  # 本机 TLS：host 127.0.0.1、tls.enabled false，由本机 nginx / Caddy 对外提供 TLS。
  # 经反代：网关直接以 HTTPS 监听非标准端口，反代机以证书固定（推荐双向 TLS）转发过来。
  host: 0.0.0.0                   # 经反代时监听公网网卡；安全组只放行反代机 IP 到该端口
  port: 8443
  tls:
    enabled: true
    # 路径可引用环境变量，例如 systemd LoadCredential= 时写 ${CREDENTIALS_DIRECTORY}/server.key
    certFile: /etc/claude-gateway/tls/server.crt   # 自建小 CA 签发的长期证书，SAN 例如 gateway.internal
    keyFile: /etc/claude-gateway/tls/server.key    # 0600
    clientCa: /etc/claude-gateway/tls/ca.crt       # 双向 TLS：只接受该 CA 签发的客户端证书
    requireClientCert: true
    allowedClientCNs: [cgw-proxy-example]          # 可选：再限定客户端证书 CN
  publicBaseUrl: https://gateway.example.com   # 替换为你的域名，用于生成客户端配置片段
  maxRequestBodyMB: 64            # 与反代的 client_max_body_size 一致
  pingIntervalMs: 15000           # 流式响应中上游无字节超过该间隔时由网关发 ping
  stateDir: /var/lib/claude-gateway   # SQLite（key 哈希、请求日志元数据、会话线状态、thinking 来源登记）

security:
  keys:
    acceptHeaders: [authorization, x-api-key]   # 网关 key 由 `cgw key create` 签发，只存 SHA-256 哈希
  rateLimit:
    perKey: { rpm: 240 }
    perIpUnauthenticated: { rpm: 30 }
  authFailure:
    banAfter: 5                   # 同一 IP 窗口内失败次数
    windowSec: 300
    banSec: [600, 3600, 86400]    # 指数退避
  ipAllowlist:
    enabled: false
    cidrs: []
  trustProxyHeaders: true         # 经反代时开启，用于取真实客户端 IP
  trustedProxies: [203.0.113.10]  # 只填反代机的公网 IP（示例为文档保留地址）

# profile 字段（渠道一级，能力字段必填）：
#   authHeader            上游认证头：x-api-key / bearer
#   betaStrip             上游会拒收的 anthropic-beta 值
#   thinkingReplay        用户切换模型后历史 thinking 的处理：passthrough / keep-unsigned / strip-foreign（会话专题 §4.2）
#   redactedThinking      是否接受 redacted_thinking
#   timeouts              connectMs / firstByteMs（到首个内容事件）/ idleMs（流开始后两次数据的最长间隔）
#   countTokens           upstream（转发上游原生 count_tokens；Coding Plan 渠道不会转发）/ estimate（本地估算）
#   metadataUserId        strip（默认，cc 的 user_id 含设备与账号标识）/ passthrough
#   toolStrip             转发前从 tools 中去掉的工具名（默认空）
#   overlongPatterns      追加的非 Anthropic 超长错误正则（命名组 req、max），内置规则见 src/config/load.ts
#   replayErrorPatterns   追加的“切换后历史不兼容”错误正则
#   signatureErrorPatterns  追加的签名类错误正则（改写为 cc 能识别的措辞）
channels:
  - id: deepseek
    protocol: anthropic_messages
    baseUrl: https://api.deepseek.com/anthropic
    billing: payg
    apiKeyEnv: DEEPSEEK_API_KEY   # 每个渠道一把 key；同一服务商的另一把 key 另配一个渠道
    concurrency: null             # 官方按账户限并发（deepseek-flash 2500、deepseek-v4-pro 500），单人远达不到，默认不限
    profile:
      authHeader: x-api-key       # M0：x-api-key 与 Bearer 均可
      betaStrip: []               # M0：cc 2.1.309 发送的 beta 值与 context-1m 等全部接受
      thinkingReplay: passthrough # M0：接受任意来源的 thinking（有无签名均可），且工具调用轮必须回传 thinking
      redactedThinking: unsupported   # M0：redacted_thinking 返回 422
      timeouts: { connectMs: 10000, firstByteMs: 600000, idleMs: 120000 }
      countTokens: upstream       # M0：原生 /v1/messages/count_tokens 可用
      metadataUserId: strip

  - id: zhipu-api
    protocol: anthropic_messages
    baseUrl: https://open.bigmodel.cn/api/anthropic
    billing: payg
    apiKeyEnv: ZHIPU_API_KEY
    concurrency: 5                # 官方按账户权益等级与模型分别限并发，数值在控制台“速率限制”页查看；示例值，请按控制台填写
    profile:
      authHeader: x-api-key       # M0（仅到 401 阶段）：x-api-key 与 Bearer 均被识别
      betaStrip: []
      thinkingReplay: passthrough # 以下三项按同端点 zhipu-coding 的实测推定，按量 key 未单独验证
      redactedThinking: supported
      timeouts: { connectMs: 10000, firstByteMs: 600000, idleMs: 120000 }
      countTokens: estimate
      toolStrip: [ToolSearch]

  - id: zhipu-coding
    protocol: anthropic_messages
    baseUrl: https://open.bigmodel.cn/api/anthropic   # 与 zhipu-api 同一 URL；M0：同一账号的两把 key，Coding Plan key 计入套餐积分、按量 key 扣账户余额，计费由 key 决定
    billing: coding-plan
    interactiveOnly: true         # 只承载 cc 发起的交互请求，网关自发调用不走此渠道（方案 §6.3）
    apiKeyEnv: ZHIPU_CODING_API_KEY
    concurrency: 2                # 官方未公开具体数字（按套餐等级动态）；保守默认 2，可调
    profile:
      authHeader: x-api-key
      betaStrip: []               # M0：cc 2.1.309 的 7 个 beta 值加 context-1m 一并发送时接受
      thinkingReplay: passthrough # M0：自己的、别家签名的、无签名的 thinking 以及工具调用轮缺 thinking 都接受
      redactedThinking: supported # M0：redacted_thinking 返回 200
      timeouts: { connectMs: 10000, firstByteMs: 600000, idleMs: 120000 }
      countTokens: estimate       # M0：上游 count_tokens 可用，但 Coding Plan 渠道不转发（方案 §6.3）
      toolStrip: [ToolSearch]     # M0：tools 里有名为 ToolSearch 的工具时，上游只保留这一个工具、其余静默丢弃
    quota:
      connector: zhipu-coding     # M2：只读展示 5h / 周积分

  - id: ark-coding
    protocol: anthropic_messages
    baseUrl: https://ark.cn-beijing.volces.com/api/coding   # 勿用 /api/v3：不走套餐额度且额外计费
    billing: coding-plan
    interactiveOnly: true
    apiKeyEnv: ARK_CODING_API_KEY
    concurrency: 2                # 文档正文未给出；火山官网文章称 Lite 2 路、Pro 8 路，待控制台确认
    profile:
      authHeader: bearer          # M0（仅到 401 阶段）：x-api-key 与 Bearer 均被识别
      betaStrip: []
      thinkingReplay: strip-foreign   # 方舟上的 DeepSeek / Kimi 是否需要 passthrough，待有 key 后 M0
      redactedThinking: unsupported
      timeouts: { connectMs: 10000, firstByteMs: 600000, idleMs: 120000 }
      countTokens: estimate
    quota:
      connector: ark-coding

# 对外 ID（键）必须是 Claude 形态：Claude 桌面端会移除含 deepseek/glm/kimi/doubao/seed- 等片段的模型 ID，
# 加载配置时网关按同一规则校验（docs/桌面端接入.md §2.4）。
# 一个对外 ID = 一个“模型 × 渠道”（无备用渠道）；displayName 写成“真实模型（渠道）”。
# 能力字段必填：contextWindow、maxOutputTokens、inputModalities、thinking（optional / always-on / none）、maxEffort。
# 可选：concurrency（覆盖渠道值）、autoCompactWindow（生成 cc 压缩窗口；默认取 contextWindow 的 75%）。
models:
  claude-gw-dsflash:
    displayName: DeepSeek V4.1 Flash（官方）
    channel: deepseek
    upstreamModel: deepseek-flash   # 官方名，当前由 DeepSeek-V4.1-Flash-1017 提供服务
    contextWindow: 1048576          # 输入 + 输出合计（M0 超长报错原文中的上限）
    maxOutputTokens: 393216
    inputModalities: [text, image]
    thinking: optional              # 默认开启，可关闭
    maxEffort: max                  # 支持 low / high / max
  claude-gw-dsv4pro:
    displayName: DeepSeek V4 Pro（官方）
    channel: deepseek
    upstreamModel: deepseek-v4-pro
    contextWindow: 1048576
    maxOutputTokens: 393216
    inputModalities: [text]
    thinking: optional
    maxEffort: max
  claude-gw-zp53flash-plan:
    displayName: GLM-5.3-Flash（智谱 Coding Plan）
    channel: zhipu-coding           # 2026-10-27 定：opus 档优先走智谱 Coding Plan
    upstreamModel: glm-5.3-flash
    contextWindow: 1000000          # 官方标注 1M
    maxOutputTokens: 131072         # 官方标注 128K；M0：max_tokens 超过 131072 返回 400（1210）
    inputModalities: [text, image]  # M0：经 Anthropic 兼容端点传图（base64 PNG）能正确识别
    thinking: always-on             # 官方：thinking.type 仅支持 enabled；M0：传 disabled 时有时仍返回 thinking
    maxEffort: max
  claude-gw-zp53flash:
    displayName: GLM-5.3-Flash（智谱按量）
    channel: zhipu-api
    upstreamModel: glm-5.3-flash
    contextWindow: 1000000
    maxOutputTokens: 131072
    inputModalities: [text, image]
    thinking: always-on
    maxEffort: max
  claude-gw-dsv4pro-hs:
    displayName: DeepSeek V4 Pro（火山）
    channel: ark-coding
    upstreamModel: deepseek-v4-pro
    contextWindow: 1000000          # 方舟文档为 1024k，待 M0
    maxOutputTokens: 131072
    inputModalities: [text]
    thinking: optional
    maxEffort: max
  claude-gw-sd21pro-hs:
    displayName: Doubao Seed 2.1 Pro（火山）
    channel: ark-coding
    upstreamModel: doubao-seed-2.1-pro
    contextWindow: 1000000
    maxOutputTokens: 131072
    inputModalities: [text, image]
    thinking: optional
    maxEffort: high

# 场景与模型的对应由客户端档位决定（方案 §4.9）。网关不按场景改模型，
# 只用这里的默认值生成桌面端 inferenceModels 的 anthropicFamilyTier / isFamilyDefault、
# /v1/models 的 anthropic_family_tier，以及 cc 的 ANTHROPIC_DEFAULT_*_MODEL。
# 两个档位指向同一个对外 ID 时，后出现的档位自动得到档位别名 <ID>-<档位>（例如 claude-gw-dsflash-haiku）。
clients:
  tiers:
    sonnet: claude-gw-dsflash     # 默认主对话：DeepSeek V4.1 Flash（官方）
    haiku: claude-gw-dsflash      # 后台小任务（起标题、总结等）：同上
    opus: claude-gw-zp53flash-plan   # GLM-5.3-Flash（智谱 Coding Plan）
  subagentModel: null             # 生成 CLAUDE_CODE_SUBAGENT_MODEL；null 表示子 agent 跟随主会话模型
  sessionStateTtlHours: 24        # 会话线状态（切换检测、thinking 登记）

limits:
  # concurrency 超限时先排队，最多 queueTimeoutMs，之后返回 429 + retry-after（方案 §4.3、§4.12）
  queueTimeoutMs: 60000
  rejectStatus: 429
  rejectRetryAfterSec: 120        # 大于 60：cc 不再静默重试，立即显示错误
  # rejectMessage 默认即 2026-10-27 用户确认的原文（src/config/texts.ts），一般不需要配置
  responseHeaders: ietf-draft     # 附加 RateLimit-Policy / RateLimit 头；不伪造 anthropic-ratelimit-unified-*

concurrencyHint:
  # 把并发限制告诉模型（方案 §4.12）
  clientMaxToolUseConcurrency: auto   # 生成 settings env 的 CLAUDE_CODE_MAX_TOOL_USE_CONCURRENCY：sonnet 档模型的上限 - 1；不限时不写
  injectSystemPrompt: auto        # auto：配置了 concurrency 的对外 ID 开启、未配置的不注入；false 关闭
  injectFor: [main, subagent]     # 后台小任务不注入
  # textTemplate 默认即用户确认的原文（src/config/texts.ts）

switchAdvice:
  mode: reactive                  # 上游返回已登记的回放类 400 后给建议（会话专题 §4.8）
  # messageTemplate 默认即用户确认的原文（src/config/texts.ts）

# —— 后续里程碑（M4）的配置草案，本期网关不读取 ——
enhance:
  vision:                         # 后续再议，本期不启用（方案 §12）；以下为将来参考
    enabled: false
    channel: ark-api              # 网关自发调用，不走 Coding Plan
    upstreamModel: doubao-seed-2-1-pro-260628
    onFailure: error              # 只有本轮新图转写失败才报错；失败不缓存
    promptVersion: null           # 转写提示词与包装文字待用户确认
    maxImageBytes: 4194304        # 只压缩发给视觉模型的副本：4MB / 长边 7900px / JPEG 85→70→50
    maxImagesPerRequest: 20
    timeoutMs: 60000
    concurrency: 4                # 多图并行
    cacheTtlDays: 30              # SQLite 持久化；键含视觉模型、提示词版本、压缩参数版本

# 搜索 / 抓取 MCP（仓库附带，独立进程，不在网关请求路径上；方案 §7.1、§7.2）
mcp:
  search:
    backends:                     # 只启用配置了 key 的后端；key 只用环境变量引用
      volcengine: { apiKeyEnv: WEB_SEARCH_API_KEY }   # 火山联网搜索专用 key（与方舟模型 key 不通用）
      bailian:    { apiKeyEnv: BAILIAN_API_KEY }      # deep 第二源；返回的是模型生成的答案，见方案 §7.1
      tavily:     { apiKeyEnv: TAVILY_API_KEY, backupApiKeyEnv: TAVILY_API_KEY_BACKUP }   # 海外；主 key 当月额度用完后改用备用 key；国内连通性待测
      tencent:    { apiKeyEnvs: [TENCENT_WSA_KEY_1, TENCENT_WSA_KEY_2] }                  # 可选；遇 401 / 429 换下一把
      zhipu:      { apiKeyEnv: ZHIPU_API_KEY }        # 可选；用按量 key，不用 Coding Plan key
    defaultIntensity: normal      # 模型可在每次调用时自选 quick / normal / deep
  fetch:
    backends: [linkreader, direct]   # 模型可自选；linkreader 需方舟按量 key
    defaultMaxChars: 50000

logging:
  level: info
  requestLog: metadata            # 只记元数据：时间、会话、模型×渠道、状态、耗时、usage、诊断
  bodies: off
  retentionDays: 14
