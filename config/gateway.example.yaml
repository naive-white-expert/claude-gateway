# claude-gateway 配置示例（草案，字段以 docs/方案-v0.1.md §5.3、§8.3、§8.4 为准，实现时可能调整）
# 原则：密钥一律通过环境变量（0600 环境文件 / systemd credentials）引用，本文件不出现明文。
#       真实配置另存为 config/gateway.yaml 或 config/*.local.yaml（已被 .gitignore 忽略）。

# 公网入口方式见方案 §8.5。
server:
  # 本机 TLS：host 127.0.0.1、tls.enabled false，由本机 nginx / Caddy 对外提供 TLS。
  # 经反代：网关直接以 HTTPS 监听非标准端口，反代机以证书固定（可选双向 TLS）转发过来。
  host: 0.0.0.0                   # 经反代时监听公网网卡；安全组只放行反代机 IP 到该端口
  port: 8443
  tls:
    enabled: true
    certFile: /etc/claude-gateway/tls/server.crt   # 自建小 CA 签发的长期证书，SAN 例如 gateway.internal
    keyFile: /etc/claude-gateway/tls/server.key    # 0600
    clientCa: /etc/claude-gateway/tls/ca.crt       # 双向 TLS（推荐）：只接受该 CA 签发的客户端证书
    requireClientCert: true
  publicBaseUrl: https://gateway.example.com   # 替换为你的域名，用于生成 cc settings 片段
  maxRequestBodyMB: 64            # 1M 上下文请求体可达数 MB，含图片更大；与反代的 client_max_body_size 一致
  upstreamTimeoutMs: 600000
  idleStreamTimeoutMs: 120000
  pingIntervalMs: 15000

security:
  keys:
    store: sqlite                 # 只存 SHA-256 哈希与元数据；明文仅在 `cgw key create` 时显示一次
    acceptHeaders: [authorization, x-api-key]
  rateLimit:
    perKey: { rpm: 120, concurrency: 8 }
    perIpUnauthenticated: { rpm: 30 }
  authFailure:
    banAfter: 5                   # 同一 IP 窗口内失败次数
    windowSec: 300
    banSec: [600, 3600, 86400]    # 指数退避
  ipAllowlist:
    enabled: false
    cidrs: []
  trustProxyHeaders: true         # 经反代时开启，用于取真实客户端 IP
  trustedProxies: [203.0.113.10]  # 只填反代机的公网 IP（示例为文档保留地址）

channels:
  - id: deepseek
    protocol: anthropic_messages
    baseUrl: https://api.deepseek.com/anthropic
    billing: payg
    apiKeyEnv: DEEPSEEK_API_KEY   # 每个渠道一把 key；同一服务商的另一把 key 另配一个渠道
    concurrency: null             # 官方按账户限并发（deepseek-flash 2500、deepseek-v4-pro 500），单人远达不到，默认不限；可在对外 ID 上覆盖
    profile:                      # 能力字段必填，加载时校验（方案 §5.3）
      authHeader: x-api-key
      betaStrip: []               # 上游拒收的 anthropic-beta 值，M0 后填写
      thinkingReplay: keep-unsigned   # thinking 模式下要求历史 thinking 回传（会话专题 §4.2）
      redactedThinking: unsupported
      timeouts: { connectMs: 10000, firstByteMs: 600000, idleMs: 120000 }

  - id: zhipu-api
    protocol: anthropic_messages
    baseUrl: https://open.bigmodel.cn/api/anthropic
    billing: payg
    apiKeyEnv: ZHIPU_API_KEY
    concurrency: 5                # 官方按账户权益等级与模型分别限并发，数值在控制台“速率限制”页查看；示例值，请按控制台填写
    profile:
      authHeader: x-api-key
      betaStrip: []
      thinkingReplay: strip-foreign   # M0 前的默认值
      redactedThinking: unsupported   # 待 M0
      timeouts: { connectMs: 10000, firstByteMs: 600000, idleMs: 120000 }

  - id: zhipu-coding
    protocol: anthropic_messages
    baseUrl: https://open.bigmodel.cn/api/anthropic   # 与 zhipu-api 同一 URL，计费区分待 M0 核实
    billing: coding-plan
    interactiveOnly: true         # 只承载 cc 发起的交互请求，网关自发调用不走此渠道（方案 §6.3）
    apiKeyEnv: ZHIPU_CODING_API_KEY
    concurrency: 2                # 官方未公开具体数字（按套餐等级动态，Max > Pro > Lite）；保守默认 2，可调
    profile:
      authHeader: x-api-key
      betaStrip: []
      thinkingReplay: strip-foreign
      redactedThinking: unsupported
      timeouts: { connectMs: 10000, firstByteMs: 600000, idleMs: 120000 }
    quota:
      connector: zhipu-coding     # 只读展示：5h / 周积分

  - id: ark-coding
    protocol: anthropic_messages
    baseUrl: https://ark.cn-beijing.volces.com/api/coding   # 勿用 /api/v3：不走套餐额度且额外计费
    billing: coding-plan
    interactiveOnly: true
    apiKeyEnv: ARK_CODING_API_KEY
    concurrency: 2                # 文档正文未给出；火山官网文章称 Lite 2 路、Pro 8 路，待控制台确认
    profile:
      authHeader: bearer          # 方舟文档以 ANTHROPIC_AUTH_TOKEN 接入；以 M0 为准
      betaStrip: []
      thinkingReplay: strip-foreign   # 方舟上的 DeepSeek / Kimi 是否需要 keep-unsigned，待 M0（可在对外 ID 上覆盖）
      redactedThinking: unsupported
      timeouts: { connectMs: 10000, firstByteMs: 600000, idleMs: 120000 }
    quota:
      connector: ark-coding       # 只读展示：5h / 周 / 月，查询方式 M2 核实

  - id: ark-api                   # 方舟按量，供网关自发调用（如 M4 图片转写）
    protocol: anthropic_messages
    baseUrl: https://ark.cn-beijing.volces.com/api/compatible
    billing: payg
    apiKeyEnv: ARK_API_KEY
    concurrency: null             # 按量 API 由 RPM / TPM 限流，默认不限
    profile:
      authHeader: bearer
      betaStrip: []
      thinkingReplay: strip-foreign
      redactedThinking: unsupported
      timeouts: { connectMs: 10000, firstByteMs: 600000, idleMs: 120000 }

# 对外 ID（键）必须是 Claude 形态：Claude 桌面端会移除含 deepseek/glm/kimi/doubao/seed- 等片段的模型 ID，
# 加载配置时网关按同一规则校验（docs/桌面端接入.md §2.4）。
# 一个对外 ID = 一个“模型 × 渠道”（无备用渠道）；同一模型的不同渠道各配一个 ID，在桌面端分别列出。
# displayName 写成“真实模型（渠道）”。渠道失败或额度用完时原样返回错误，由用户在客户端改选。
models:
  claude-gw-dsv4pro:
    displayName: DeepSeek V4 Pro（官方）
    channel: deepseek
    upstreamModel: deepseek-v4-pro
    contextWindow: 1000000        # 生成 /v1/models 的 max_input_tokens、桌面端 supports1m、cc 压缩窗口
    maxEffort: max
  claude-gw-dsv4pro-hs:
    displayName: DeepSeek V4 Pro（火山）
    channel: ark-coding
    upstreamModel: deepseek-v4-pro
    contextWindow: 1000000
  claude-gw-dsflash:
    displayName: DeepSeek V4.1 Flash（官方）
    channel: deepseek
    upstreamModel: deepseek-flash   # 官方名，当前由 DeepSeek-V4.1-Flash-1017 提供服务
    contextWindow: 1048576          # 输入 + 输出合计；官方 /models 示例
    maxOutputTokens: 393216
    inputModalities: [text, image]
    maxEffort: max                  # 支持 low / high / max，默认 high
  claude-gw-dsflash-hs:
    displayName: DeepSeek V4 Flash（火山）
    channel: ark-coding
    upstreamModel: deepseek-v4-flash
    contextWindow: 1000000
  claude-gw-zp53-plan:
    displayName: GLM-5.3（智谱套餐）
    channel: zhipu-coding
    upstreamModel: glm-5.3
    contextWindow: 200000         # 智谱直连窗口待 M0 核对
  claude-gw-zp53:
    displayName: GLM-5.3（智谱按量）
    channel: zhipu-api
    upstreamModel: glm-5.3
    contextWindow: 200000
  claude-gw-zp53flash-plan:
    displayName: GLM-5.3-Flash（智谱 Coding Plan）
    channel: zhipu-coding           # 2026-10-27 定：opus 档优先走智谱 Coding Plan
    upstreamModel: glm-5.3-flash
    contextWindow: 1000000          # 官方标注 1M
    maxOutputTokens: 131072         # 官方标注 128K
    inputModalities: [text, image]  # 官方模型页为原生多模态；经 Anthropic 兼容端点传图待 M0
    thinking: always-on             # thinking.type 仅支持 enabled
  claude-gw-zp53-hs:
    displayName: GLM-5.3（火山）
    channel: ark-coding
    upstreamModel: glm-5.3
    contextWindow: 1000000        # 方舟文档为 1024k
  claude-gw-sd21pro-hs:
    displayName: Doubao Seed 2.1 Pro（火山）
    channel: ark-coding
    upstreamModel: doubao-seed-2.1-pro
    contextWindow: 1000000
    inputModalities: [text, image]

# 场景与模型的对应由客户端档位决定（方案 §4.9）。网关不按场景改模型，
# 只用这里的默认值生成桌面端 inferenceModels 的 anthropicFamilyTier / isFamilyDefault、
# /v1/models 的 anthropic_family_tier，以及 cc 的 ANTHROPIC_DEFAULT_*_MODEL。
# 以下是默认值（2026-10-27），使用者可以在这里改成任何已配置的对外 ID；主对话仍可在桌面端随时切换。
clients:
  tiers:
    sonnet: claude-gw-dsflash     # 默认主对话：DeepSeek V4.1 Flash（官方）
    haiku: claude-gw-dsflash      # 后台小任务（起标题、总结等）：同上
    opus: claude-gw-zp53flash-plan   # GLM-5.3-Flash（智谱 Coding Plan）
  subagentModel: null             # 生成 CLAUDE_CODE_SUBAGENT_MODEL；null 表示子 agent 跟随主会话模型
  sessionStateTtlHours: 24        # 会话线状态（切换检测、thinking 登记）

limits:
  # 渠道或对外 ID 上的 concurrency 超限时的行为（方案 §4.3；排队还是立即 429 待定）
  onConcurrencyExceeded: queue    # queue | reject
  queueTimeoutMs: 60000           # 排队超时后返回 429，带短 retry-after（cc 会自动重试）

switchAdvice:
  # 用户切换模型后历史不兼容时，返回带建议的错误（会话专题 §4.8）
  mode: reactive                  # reactive：上游返回已登记的回放类 400 后给建议；predictive：按 profile 规则预判（需 M0 证实）
  messageTemplate: null           # 建议文案待用户确认

enhance:
  vision:                         # 后续再议，本期不启用（方案 §12）；以下为将来参考
    enabled: false
    channel: ark-api              # 网关自发调用，不走 Coding Plan
    upstreamModel: doubao-seed-2-1-pro-260628
    onFailure: error              # 只有本轮新图转写失败才报错；失败不缓存
    promptVersion: null           # 转写提示词与包装文字待用户确认
    maxImageBytes: 4194304        # 只压缩发给视觉模型的副本：4MB / 长边 7900px / JPEG 85→70→50
    maxImagesPerRequest: 20
    timeoutMs: 60000
    concurrency: 4                # 多图并行
    cacheTtlDays: 30              # SQLite 持久化；键含视觉模型、提示词版本、压缩参数版本

# 搜索 / 抓取 MCP（仓库附带，独立进程，不在网关请求路径上；方案 §7.1、§7.2）
mcp:
  search:
    backends:                     # 只启用配置了 key 的后端；key 只用环境变量引用
      volcengine: { apiKeyEnv: WEB_SEARCH_API_KEY }   # 火山联网搜索专用 key（与方舟模型 key 不通用）
      bailian:    { apiKeyEnv: BAILIAN_API_KEY }      # deep 第二源；返回的是模型生成的答案，见方案 §7.1
      tavily:     { apiKeyEnv: TAVILY_API_KEY }       # 海外；国内服务器连通性待测
      zhipu:      { apiKeyEnv: ZHIPU_API_KEY }        # 可选；用按量 key，不用 Coding Plan key
    defaultIntensity: normal      # 模型可在每次调用时自选 quick / normal / deep
  fetch:
    backends: [linkreader, direct]   # 模型可自选；linkreader 需方舟按量 key
    defaultMaxChars: 50000

logging:
  level: info
  requestLog: metadata            # 本期只记元数据：时间、会话、模型×渠道、状态、耗时、usage、诊断
  bodies: off
  retentionDays: 14
