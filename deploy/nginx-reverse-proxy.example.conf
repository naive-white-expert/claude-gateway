# claude-gateway：反代机 nginx 示例配置（经反代部署，见 docs/方案-v0.1.md §8.5）
#
# 拓扑：客户端 --HTTPS(公信证书)--> 反代机 nginx --HTTPS(证书固定 + 可选双向 TLS)--> 网关机:8443
#
# 占位符：
#   gateway.example.com     对外域名（已在反代机所在云完成接入备案）
#   198.51.100.20           网关机公网 IP（安全组只放行反代机 IP 访问 8443）
#   gateway.internal        网关服务端证书的 SAN（与 proxy_ssl_name 一致）
#   /etc/nginx/claude-gateway/   反代机上存放 CA 与客户端证书的目录（权限 0700，私钥 0600）
#
# 证书准备（示意，在一台可信机器上执行，CA 私钥不要放到网关机或反代机）：
#   1. 建小 CA：ca.key / ca.crt（长期，例如 10 年）
#   2. 用 CA 签发网关服务端证书：server.crt（SAN=DNS:gateway.internal），放到网关机
#   3. 用 CA 签发反代客户端证书：proxy-client.crt / proxy-client.key，放到反代机
#   4. 网关配置 server.tls：certFile/keyFile 为服务端证书，clientCa 为 ca.crt，requireClientCert: true

upstream claude_gateway {
    server 198.51.100.20:8443;
    keepalive 16;                       # 到网关的长连接
}

server {
    listen 443 ssl;
    http2 on;
    server_name gateway.example.com;

    ssl_certificate     /etc/nginx/ssl/gateway.example.com/fullchain.pem;   # 公信证书（acme.sh / certbot）
    ssl_certificate_key /etc/nginx/ssl/gateway.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 1M 上下文的请求体可达数 MB，含图片更大；与网关 server.maxRequestBodyMB 一致
    client_max_body_size 64m;

    location / {
        proxy_pass https://claude_gateway;

        # —— 到网关这一跳：证书固定 ——
        proxy_ssl_verify              on;
        proxy_ssl_trusted_certificate /etc/nginx/claude-gateway/ca.crt;
        proxy_ssl_name                gateway.internal;
        proxy_ssl_server_name         on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_protocols           TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse       on;

        # —— 双向 TLS（推荐）：网关只接受该客户端证书 ——
        proxy_ssl_certificate         /etc/nginx/claude-gateway/proxy-client.crt;
        proxy_ssl_certificate_key     /etc/nginx/claude-gateway/proxy-client.key;

        # —— 流式（SSE）——
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;              # 不缓冲响应，SSE 事件和 ping 逐条到达
        proxy_cache off;
        # proxy_request_buffering on;     # 默认 on：先收完请求体再转发；可改 off 减少落盘，部署时评估
        proxy_read_timeout 900s;          # 不低于网关首字节超时（600s）
        proxy_send_timeout 900s;
        proxy_connect_timeout 10s;

        # —— 头 ——
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Authorization / x-api-key 默认原样转发，不要在这里清除或改写
    }
}

server {
    listen 80;
    server_name gateway.example.com;
    return 301 https://$host$request_uri;
}
